---
- name: Configure spark edge node
  hosts: edge
  become: yes

  vars:
    spark_conf_dir: "/opt/spark/spark-2.4.3-bin-hadoop2.7/conf"
    spark_jars_dir: "/opt/spark/spark-2.4.3-bin-hadoop2.7/jars"
    gcs_connector_version: "hadoop2-2.2.5"
    gcs_connector_url: "https://storage.googleapis.com/hadoop-lib/gcs/gcs-connector-{{ gcs_connector_version }}.jar"

  tasks:
    - name: Download GCS connector JAR
      get_url:
        url: "{{ gcs_connector_url }}"
        dest: "{{ spark_jars_dir }}/gcs-connector.jar"
        mode: "0644"

    - name: Configure core-site.xml for GCS access
      copy:
        dest: "{{ spark_conf_dir }}/core-site.xml"
        mode: "0644"
        content: |
          <configuration>
            <property>
              <name>fs.gs.impl</name>
              <value>com.google.cloud.hadoop.fs.gcs.GoogleHadoopFileSystem</value>
            </property>
            <property>
              <name>fs.AbstractFileSystem.gs.impl</name>
              <value>com.google.cloud.hadoop.fs.gcs.GoogleHadoopFS</value>
            </property>
          </configuration>
